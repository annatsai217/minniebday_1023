.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sub{text-align:center;color:var(--mute);font-size:12px;margin-bottom:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tab{flex:1 0 auto;min-width:54px;font:inherit;border:1px solid var(--line);background:#fff;color:var(--tx);border-radius:14px;padding:7px 4px;cursor:pointer;text-align:center}
.tab b{display:block;font-size:16px}
.tab span{font-size:11px;color:var(--mute)}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tab.on span{color:#fff}
.list{display:flex;flex-direction:column;gap:9px}
.slot{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;gap:8px}
.time{font-weight:700;font-size:15px}
.tag{padding:6px 10px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap}
.s-none{background:var(--nonebg);color:var(--none)}
.s-ok{background:var(--okbg);color:var(--ok)}
.s-busy{background:#fdeedb;color:#c9731a}
.s-full{background:var(--fullbg);color:var(--full)}
.legend{margin-top:16px;text-align:center;color:var(--mute);font-size:11px;line-height:1.7}
.slot.chg{border-color:var(--ac)}
.slot.ed{flex-wrap:wrap}
.seg{display:flex;gap:5px;width:100%}
.seg button{flex:1;font:inherit;font-size:12px;font-weight:700;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--tx);cursor:pointer}
.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.adm{text-align:center;margin-top:18px}
.adm button,.bar button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;background:var(--ac);color:#fff;cursor:pointer}
.adm button.g,.bar button.g{background:var(--line);color:var(--tx)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--bd);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.bar span{font-size:13px;color:var(--mute);width:100%;text-align:center}
</style>
</head>
<body>
<main>
  <div class="banner" role="img" aria-label="Minnie Birthday Event 生咖人流查詢系統"></div>
  <h1 class="sr">Minnie 生咖・各時段看展人數</h1>
  <div class="sub" id="sub">依目前預約名單統計，點選日期查看各時段</div>
  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"></div>
  <div class="legend">目前無人預約 ｜ 空間舒服 ｜ 擁擠 ｜ 額滿，人潮偏多<br>實際人數以現場為準</div>
  <div class="adm" id="adm"></div>
</main>
<div id="adminbar"></div>
<script id="app">
(function(){
  var SLOTS=["11:00-11:30","11:30-12:00","12:00-12:30","12:30-13:00","13:00-13:30","13:30-14:00","14:00-14:30","14:30-15:00","15:00-15:30","15:30-16:00","16:00-16:30","16:30-17:00","17:00-17:30","17:30-18:00"];
  var DAYS=[["10/22","四"],["10/23","五"],["10/24","六"],["10/25","日"],["10/26","一"]];
  var LABELS=["無預約","空間舒服","擁擠","額滿"];
  var PW_KEY="minnie_admin_pw";
  var saved={},draft={},loaded=false;
  var cur=DAYS[0][0];
  var now=new Date(),key=(now.getMonth()+1)+"/"+now.getDate();
  DAYS.forEach(function(d){if(d[0]===key)cur=d[0]});
  var isAdmin=false,editing=false,busy=false,pw=null;
  var DEFAULT_SUB=document.getElementById("sub").textContent;
  var $=function(i){return document.getElementById(i)};
  var clone=function(o){return JSON.parse(JSON.stringify(o))};

  function get(o,d,t){return (o[d]&&o[d][t])||0}
  function status(n){
    if(n>=3)return["s-full","額滿，人潮偏多"];if(n>=2)return["s-busy","擁擠"];
    if(n>=1)return["s-ok","空間舒服"];
    return["s-none","目前無人預約"];
  }
  function diff(){
    var out=[];
    DAYS.forEach(function(d){SLOTS.forEach(function(t){var n=get(draft,d[0],t);if(n!==get(saved,d[0],t))out.push({day:d[0],slot:t,level:n})})});
    return out;
  }
  function setN(d,t,n){
    if(!draft[d])draft[d]={};
    if(n===0)delete draft[d][t];else draft[d][t]=n;
    render();
  }
  function setSub(msg){$("sub").textContent=msg||DEFAULT_SUB}
  function render(){
    var tabs=$("tabs"),list=$("list");
    tabs.innerHTML="";list.innerHTML="";
    DAYS.forEach(function(d){
      var b=document.createElement("button");
      b.className="tab"+(d[0]===cur?" on":"");
      b.innerHTML="<b>"+d[0]+"</b><span>週"+d[1]+"</span>";
      b.onclick=function(){cur=d[0];render()};
      tabs.appendChild(b);
    });
    SLOTS.forEach(function(t){
      var n=get(draft,cur,t),s=status(n);
      var row=document.createElement("div");
      row.className="slot"+(editing?" ed":"")+(editing&&n!==get(saved,cur,t)?" chg":"");
      var left='<div><div class="time">'+t+'</div></div>';
      if(editing){
        row.innerHTML=left+'<div class="seg">'+LABELS.map(function(l,i){return '<button type="button" class="'+(i===n?'on':'')+'" aria-pressed="'+(i===n)+'">'+l+'</button>'}).join("")+'</div>';
        [].forEach.call(row.querySelectorAll("button"),function(x,i){x.onclick=function(){setN(cur,t,i)}});
      }else{
        row.innerHTML=left+'<div class="tag '+(loaded?s[0]:'s-none')+'">'+(loaded?s[1]:"載入中…")+'</div>';
      }
      list.appendChild(row);
    });
    renderAdmin();
  }
  function renderAdmin(){
    var adm=$("adm"),bar=$("adminbar");
    adm.innerHTML="";bar.innerHTML="";bar.className="";
    if(!isAdmin)return;
    if(!editing){
      var b=document.createElement("button");b.className="g";b.type="button";b.textContent="後台編輯";
      b.onclick=function(){draft=clone(saved);editing=true;render()};
      var o=document.createElement("button");o.className="g";o.type="button";o.textContent="登出";o.style.marginLeft="8px";
      o.onclick=function(){sessionStorage.removeItem(PW_KEY);pw=null;isAdmin=false;history.replaceState(null,"",location.pathname);render()};
      adm.appendChild(b);adm.appendChild(o);
      return;
    }
    var n=diff().length;
    bar.className="bar";
    bar.innerHTML='<span>'+(busy?'儲存中…':(n?'有 '+n+' 個時段尚未儲存':'點選各時段的狀態來調整'))+'</span><button class="g" type="button">取消</button><button type="button">儲存並發布</button>';
    var bs=bar.querySelectorAll("button");
    bs[0].onclick=function(){draft=clone(saved);editing=false;render()};
    bs[1].onclick=save;
    bs[1].disabled=busy||!n;
  }
  function load(){
    return fetch("/api/status",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(data){
      saved=data;loaded=true;
      if(!editing)draft=clone(saved);
      render();
    }).catch(function(){if(!loaded)setSub("資料載入失敗，請重新整理")});
  }
  function save(){
    var changes=diff();
    if(busy||!changes.length)return;
    busy=true;renderAdmin();
    fetch("/api/status",{method:"PUT",headers:{"Content-Type":"application/json","x-admin-password":pw},body:JSON.stringify({changes:changes})})
      .then(function(r){
        if(r.status===401){sessionStorage.removeItem(PW_KEY);throw "auth"}
        if(!r.ok)throw "fail";
        return r.json();
      }).then(function(data){
        busy=false;saved=data;draft=clone(saved);editing=false;
        setSub("已儲存，所有人都會看到最新狀態");render();
        setTimeout(function(){setSub()},4000);
      }).catch(function(e){
        busy=false;
        setSub(e==="auth"?"密碼錯誤或已失效，請重新登入":"儲存失敗，請稍後再試");
        if(e==="auth"){isAdmin=false;editing=false;pw=null;draft=clone(saved);render()}else renderAdmin();
      });
  }
  function login(p){
    return fetch("/api/status",{method:"POST",headers:{"x-admin-password":p}}).then(function(r){
      if(r.ok){pw=p;sessionStorage.setItem(PW_KEY,p);isAdmin=true;editing=true;draft=clone(saved);setSub();render();return}
      sessionStorage.removeItem(PW_KEY);
      setSub(r.status===503?"尚未設定後台密碼 ADMIN_PASSWORD":"密碼錯誤");
    }).catch(function(){setSub("登入失敗，請稍後再試")});
  }
  function checkHash(){
    if(location.hash!=="#admin"||isAdmin)return;
    var stored=sessionStorage.getItem(PW_KEY);
    if(stored)return login(stored);
    var p=window.prompt("請輸入後台密碼");
    if(p)login(p);
  }
  window.addEventListener("hashchange",checkHash);
  render();
  load().then(checkHash);
  setInterval(function(){if(!editing&&!document.hidden)load()},30000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden&&!editing)load()});
})();
</script>
</body>
</html>
